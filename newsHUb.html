<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 1rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .nav-container {
            background: #f8f9fa;
            border-bottom: 3px solid #e9ecef;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        .content {
            padding: 2rem;
            min-height: 500px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #666;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .news-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .news-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #e74c3c, #f39c12, #2ecc71);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .news-item:hover::before {
            transform: scaleX(1);
        }

        .news-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
        }

        .news-content {
            padding: 1.5rem;

        .news-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #2c3e50;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-description {

            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;

            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #888;

            border-radius: 25px;
            font-weight: 600;

            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .read-more::before {
            content: '';

            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .read-more:hover::before {
            left: 100%;
        }

        .read-more:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
        }

        .error-message {
            text-align: center;

            background: #fdf2f2;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
            border: 2px solid #fed7d7;

            text-align: center;
            position: relative;
            padding-bottom: 0.5rem;

        .category-title::after {
            content: '';
            position: absolute;
            bottom: 0;

            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);

        .mobile-menu-toggle {

            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 5px;
            cursor: pointer;

            }

            .news-title {
                font-size: 1.1rem;
            }

                min-height: 50px;
            }

            .ad-banner.horizontal {
                height: 50px;

            .ad-banner.vertical {
                height: 100px;

        function extractImageFromContent(content, link) {
            if (!content) return null;
            
            const imgRegex = /<img[^>]*src=["']([^"']+)["'][^>]*>/i;
            const match = content.match(imgRegex);
            
            if (match && match[1]) {
                let imgSrc = match[1];
                if (imgSrc.startsWith('//')) {
                    imgSrc = 'https:' + imgSrc;
                } else if (imgSrc.startsWith('/')) {
                    const url = new URL(link);
                    imgSrc = url.origin + imgSrc;
                }
                return imgSrc;
            }
            return null;

        function cleanText(text) {
            if (!text) return '';
            return text.replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, ' ').trim();
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            } catch (e) {
                return '';
            }
        }

        async function fetchRSSFeed(category) {
            const rssUrl = RSS_FEEDS[category];
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const items = xmlDoc.querySelectorAll('item');
                const articles = [];
                
                for (let i = 0; i < Math.min(items.length, 10); i++) {
                    const item = items[i];
                    const title = item.querySelector('title')?.textContent || 'No title available';
                    const link = item.querySelector('link')?.textContent || '#';
                    const description = item.querySelector('description')?.textContent || 'No description available';
                    const pubDate = item.querySelector('pubDate')?.textContent || '';
                    const content = item.querySelector('content\\:encoded, encoded')?.textContent || description;
                    
                    let imageUrl = extractImageFromContent(content, link);
                    
                    // Try to find image in media:content or enclosure
                    if (!imageUrl) {
                        const mediaContent = item.querySelector('media\\:content, content');
                        if (mediaContent) {
                            imageUrl = mediaContent.getAttribute('url');
                        }
                    }
                    
                    if (!imageUrl) {
                        const enclosure = item.querySelector('enclosure');
                        if (enclosure && enclosure.getAttribute('type')?.startsWith('image/')) {
                            imageUrl = enclosure.getAttribute('url');
                        }
                    }
                    
                    if (!imageUrl) {
                        imageUrl = getPlaceholderImage(category);
                    }
                    
                    articles.push({
                        title: cleanText(title),
                        link: link,
                        description: cleanText(description),
                        pubDate: formatDate(pubDate),
                        imageUrl: imageUrl
                    });
                }
                
                return articles;
            } catch (error) {
                console.error('Error fetching RSS feed:', error);
                throw error;
            }
        }

        function displayNews(articles, category) {
            const categoryName = CATEGORY_NAMES[category];
            let html = `
                <div class="ad-container">
                    <div class="ad-label">Advertisement</div>
                    <div class="ad-banner horizontal" id="top-banner">
                        Loading ad...
                    </div>
                </div>
                <h2 class="category-title">${categoryName}</h2>
            `;
            
            if (articles.length === 0) {
                html += `
                    <div class="error-message">
                        <h3>📰 No News Available</h3>
                        <p>Sorry, we couldn't load any news articles for this category right now.</p>
                    </div>
                `;
            } else {
                html += '<div class="news-grid">';
                
                articles.forEach((article, index) => {
                    html += `
                        <article class="news-item">
                            <img src="${article.imageUrl}" alt="${article.title}" class="news-image" 
                                 onerror="this.src='${getPlaceholderImage(category)}'">
                            <div class="news-content">
                                <h3 class="news-title">${article.title}</h3>
                                <div class="news-meta">
                                    <span class="news-date">${article.pubDate}</span>
                                    <span class="news-source">${categoryName}</span>
                                </div>
                                <p class="news-description">${article.description}</p>
                                <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="read-more">
                                    Read More →
                                </a>
                            </div>
                        </article>
                    `;
                    
                    // Insert vertical ad after the 3rd news item
                    if (index === 2) {
                        html += `
                            <div class="ad-container" style="grid-column: 1 / -1;">
                                <div class="ad-label">Advertisement</div>
                                <div class="ad-banner rectangle" id="middle-banner">
                                    Loading ad...
                                </div>
                            </div>
                        `;
                    }
                });
                
                html += '</div>';
            }
            
            html += `
                <div class="ad-container" id="bottom-ad">
                    <div class="ad-label">Advertisement</div>
                    <div class="ad-banner horizontal" id="bottom-banner">
                        Loading ad...
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            
            // Load ads after the content is rendered
            loadAdsterraAds();
            
            // Load middle banner ad separately
            const middleBanner = document.getElementById('middle-banner');
            if (middleBanner) {
                middleBanner.innerHTML = '<div id="container-9e8c3d1e7a0f4c9d8c3d8c3d8c3d8c3"></div>';
                const script = document.createElement('script');
                script.src = 'https://www.profitablecreativeformat.com/9e8c3d1e7a0f4c9d8c3d8c3d8c3d8c3/invoke.js';
                script.async = true;
                middleBanner.appendChild(script);
            }
        }

        async function loadCategory(category, buttonElement) {
            // Update active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (buttonElement) buttonElement.classList.add('active');
            
            // Close mobile menu
            document.getElementById('navMenu').classList.remove('active');
            
            currentCategory = category;
            showLoading();
            
            try {
                const articles = await fetchRSSFeed(category);
                displayNews(articles, category);
            } catch (error) {
                showError('Failed to fetch news. This might be due to CORS restrictions or network issues.');
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            loadCategory('technology', document.querySelector('.nav-btn.active'));
        });

        // Auto-refresh every 10 minutes
        setInterval(() => {
            if (currentCategory) {
                loadCategory(currentCategory, document.querySelector('.nav-btn.active'));
            }
        }, 600000);
    </script>
